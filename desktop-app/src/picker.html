<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
<title>Compartilhar tela</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #161a24; color: #e6e8f0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; }
  header { padding: 18px 22px 10px; }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 700; }
  header p { margin: 0; color: #8f96ad; }
  .tabs { display: flex; gap: 6px; padding: 8px 22px 0; }
  .tabs button { border: 0; background: transparent; color: #8f96ad; font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .tabs button.on { background: #262c3d; color: #fff; }
  .tabs button:focus-visible, .src:focus-visible, footer button:focus-visible { outline: 2px solid #7b61ff; outline-offset: 2px; }
  main { flex: 1; overflow: auto; padding: 14px 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; align-content: start; }
  .src { border: 2px solid transparent; background: #1c2130; border-radius: 12px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .src:hover { background: #262c3d; }
  .src.sel { border-color: #7b61ff; background: #262c3d; }
  .src img.th { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #10131b; border-radius: 8px; display: block; }
  .src .nm { display: flex; align-items: center; gap: 6px; margin-top: 7px; overflow: hidden; }
  .src .nm img { width: 16px; height: 16px; flex-shrink: 0; }
  .src .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: #8f96ad; grid-column: 1 / -1; padding: 30px 0; text-align: center; }
  footer { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-top: 1px solid #2a3044; }
  footer label { display: flex; align-items: center; gap: 8px; color: #c9cddb; flex: 1; cursor: pointer; }
  footer label small { color: #8f96ad; display: block; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #7b61ff; }
  footer button { border: 0; border-radius: 9px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #cancel { background: #262c3d; color: #e6e8f0; }
  #go { background: #7b61ff; color: #fff; }
  #go:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
  <header><h1>Compartilhar tela</h1><p>Escolha o que as pessoas da chamada vão ver.</p></header>
  <div class="tabs" role="tablist">
    <button class="on" data-k="window" role="tab">Janelas</button>
    <button data-k="screen" role="tab">Telas inteiras</button>
  </div>
  <main id="list"></main>
  <footer>
    <label id="audio-row"><input type="checkbox" id="audio" checked><span>Enviar o som<small id="audio-help">O som do computador vai junto (as vozes da chamada não).</small></span></label>
    <button id="cancel">Cancelar</button>
    <button id="go" disabled>Compartilhar</button>
  </footer>
  <script src="picker.js"></script>
</body>
</html>
